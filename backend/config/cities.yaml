# Target city universe for the Charging Demand model.
#
# rto_codes are the *printed* RTO codes (e.g. MH-12). Vahan's dashboard uses
# internal numeric office IDs which differ per state and must be resolved at
# ingest time from the live RTO dropdown (see sources/vahan.py:list_rtos).
# Never hardcode the numeric IDs — they are database keys, not RTO numbers.
#
# tier:      metro | tier2
# corridor:  1 if the city sits on a golden-quadrilateral / major NH corridor
#            (manual coding, see config/policy_scores.yaml for provenance)
#
# Demographic columns are intentionally absent here. They come from the census
# source and are stored with explicit provenance so nothing is invented.

cities:
